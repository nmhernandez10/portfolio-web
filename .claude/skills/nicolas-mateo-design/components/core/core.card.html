<!-- @dsCard group="Components" viewport="700x340" name="Core" subtitle="Button, Tag, Card, Divider, Portrait" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="../../ds-preview-fallback.js"></script>
<style>body{padding:24px 26px;background:var(--paper)}</style>
</head><body><div id="root"></div>
<script type="text/plain" id="app">
(async () => { try {
  const DS = await dsResolve(["Button","Tag","Card","Divider","Portrait"], { root: '../../' });

  const { Button, Tag, Card, Divider, Portrait } = DS;
  function Demo() {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:22}}>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
          <Button>Primary</Button>
          <Button variant="accent" trailing="→">Accent</Button>
          <Button variant="secondary">Secondary</Button>
          <Button variant="ghost">Ghost</Button>
          <Button size="sm" variant="secondary">Small</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Tag>TypeScript</Tag><Tag>PostgreSQL</Tag><Tag tone="clay">Feature Architect</Tag>
          <Tag tone="moss" dot>Open to work</Tag><Tag tone="outline">AWS</Tag>
          <Tag mono={false}>Remote</Tag>
        </div>
        <Divider label="Containers" space="0" />
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr auto',gap:14}}>
          <Card pad="16px"><span style={{font:'var(--type-small)',color:'var(--ink-1)'}}>raised</span></Card>
          <Card tone="sunk" pad="16px"><span style={{font:'var(--type-code)',color:'var(--ink-2)'}}>sunk</span></Card>
          <Card tone="inverse" pad="16px"><span style={{font:'var(--type-small)',color:'var(--text-inverse)'}}>inverse</span></Card>
          <Portrait src="../../assets/portrait.jpg" size={74} shape="arch" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
} catch (e) { console.error("DS render failed", e); document.getElementById("root").textContent = "Failed to load: " + e.message; } })();
</script>
<script>
(function () {
  function boot() {
    try {
      var src = document.getElementById('app').textContent;
      (0, eval)(Babel.transform(src, { presets: ['react'] }).code);
    } catch (e) { console.error('DS boot failed', e); }
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script></body></html>
