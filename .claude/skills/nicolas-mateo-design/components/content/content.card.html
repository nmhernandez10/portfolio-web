<!-- @dsCard group="Components" viewport="700x420" name="Content" subtitle="SectionHeader, ExperienceItem, StatBlock, SkillGroup, ProjectCard" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="../../ds-preview-fallback.js"></script>
<style>body{padding:24px 26px;background:var(--paper)}</style>
</head><body><div id="root"></div>
<script type="text/plain" id="app">
(async () => { try {
  const DS = await dsResolve(["SectionHeader","ExperienceItem","StatBlock","SkillGroup","ProjectCard"], { root: '../../' });

  const { SectionHeader, ExperienceItem, StatBlock, SkillGroup, ProjectCard } = DS;
  function Demo() {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <SectionHeader index="02" label="Experience" title="Six years of production backends." style={{marginBottom:8}} />
        <div style={{display:'flex',gap:56}}>
          <StatBlock value="200k+" label="Sessions" note="Keel Mind" />
          <StatBlock value="85k+" label="Clients" />
          <StatBlock value="4–8" label="Engineers led" />
        </div>
        <ExperienceItem current period="Mar 2024 — Present" location="Canada (Remote)"
          role="Feature Architect" company="Keel Mind"
          summary="Lead technical design and delivery across backend, web, mobile and QA."
          points={['Own PostgreSQL modeling for session, reporting and analytics workloads.']}
          tags={['NestJS','PostgreSQL','AWS Lambda']} />
        <SkillGroup title="Data" items={['PostgreSQL','SQL','Migrations','Redis','ETL']} />
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:14}}>
          <ProjectCard index="01" title="Session pipeline" kicker="Keel Mind · 2025"
            description="Recording, transcription and post-session analysis moved off the request path."
            tags={['Lambda','SQS','S3']} />
          <ProjectCard index="02" title="Agent review flow" kicker="Internal tooling"
            description="Agent-driven first pass on pull requests, checked against versioned convention files."
            tags={['Claude Code','GitHub Actions']} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
} catch (e) { console.error("DS render failed", e); document.getElementById("root").textContent = "Failed to load: " + e.message; } })();
</script>
<script>
(function () {
  function boot() {
    try {
      var src = document.getElementById('app').textContent;
      (0, eval)(Babel.transform(src, { presets: ['react'] }).code);
    } catch (e) { console.error('DS boot failed', e); }
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script></body></html>
