<!-- @dsCard group="Components" viewport="700x310" name="Forms" subtitle="Input and Textarea with mono uppercase labels" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="../../ds-preview-fallback.js"></script>
<style>body{padding:24px 26px;background:var(--paper)}</style>
</head><body><div id="root"></div>
<script type="text/plain" id="app">
(async () => { try {
  const DS = await dsResolve(["Input","Textarea","Button"], { root: '../../' });

  const { Input, Textarea, Button } = DS;
  function Demo() {
    return (
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <Input label="Name" placeholder="your name" />
          <Input label="Email" type="email" placeholder="you@company.com" hint="I reply within a couple of days." />
          <Input label="Email" defaultValue="not-an-email" error="That address doesn't look right." />
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <Textarea label="Message" rows={5} placeholder="what you're building…" />
          <Button variant="accent" trailing="→">Send</Button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
} catch (e) { console.error("DS render failed", e); document.getElementById("root").textContent = "Failed to load: " + e.message; } })();
</script>
<script>
(function () {
  function boot() {
    try {
      var src = document.getElementById('app').textContent;
      (0, eval)(Babel.transform(src, { presets: ['react'] }).code);
    } catch (e) { console.error('DS boot failed', e); }
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script></body></html>
