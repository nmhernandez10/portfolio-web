<!-- @dsCard group="Colors" viewport="700x180" name="Ink scale" subtitle="Four warm greys — heading, body, meta, disabled" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="row" style="gap:20px">
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--ink-1);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--ink-1</span><span class="val">var(--ink-1)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--ink-2);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--ink-2</span><span class="val">var(--ink-2)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--ink-3);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--ink-3</span><span class="val">var(--ink-3)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--ink-4);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--ink-4</span><span class="val">var(--ink-4)</span></div>
  </div>
  </div>
</body></html>
