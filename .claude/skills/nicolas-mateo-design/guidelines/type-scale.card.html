<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="col" style="gap:9px">
    <div class="row" style="gap:16px"><span class="val" style="width:120px">88 / display-xl</span><span style="font:var(--weight-light) 44px/1 var(--font-display);color:var(--ink-1)">Design for correctness</span></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">44 / display-m</span><span style="font:var(--weight-light) 30px/1 var(--font-display);color:var(--ink-1)">Design for correctness</span></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">34 / h1</span><span style="font:var(--weight-medium) 24px/1 var(--font-sans);color:var(--ink-1)">Design for correctness</span></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">24 / h2</span><span style="font:var(--weight-medium) 19px/1 var(--font-sans);color:var(--ink-1)">Design for correctness</span></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">17 / body</span><span style="font:var(--weight-book) 17px/1 var(--font-sans);color:var(--ink-1)">Design for correctness</span></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">13 / meta</span><span style="font:var(--weight-book) 13px/1 var(--font-sans);color:var(--ink-1)">Design for correctness</span></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">12 / label</span><span style="font:var(--weight-medium) 12px/1 var(--font-mono);color:var(--ink-1)">Design for correctness</span></div>
    <span class="val" style="margin-top:4px">shown at reduced size; tokens carry the real values</span>
  </div>
</body></html>
