<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="Warm paper whites — the whole system sits on these" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="row" style="gap:20px">
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--paper);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--paper</span><span class="val">var(--paper)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--paper-sunk);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--paper-sunk</span><span class="val">var(--paper-sunk)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--paper-raised);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--paper-raised</span><span class="val">var(--paper-raised)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--paper-inverse);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--paper-inverse</span><span class="val">var(--paper-inverse)</span></div>
  </div>
  </div>
</body></html>
