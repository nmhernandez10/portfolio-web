<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="row" style="gap:22px">
    <div class="col" style="gap:10px;align-items:center"><div style="width:110px;height:64px;background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-none)"></div><span class="val">--shadow-none</span></div>
<div class="col" style="gap:10px;align-items:center"><div style="width:110px;height:64px;background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span class="val">--shadow-sm</span></div>
<div class="col" style="gap:10px;align-items:center"><div style="width:110px;height:64px;background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><span class="val">--shadow-md</span></div>
<div class="col" style="gap:10px;align-items:center"><div style="width:110px;height:64px;background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span class="val">--shadow-lg</span></div>
  </div>
</body></html>
