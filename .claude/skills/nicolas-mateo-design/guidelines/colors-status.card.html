<!-- @dsCard group="Colors" viewport="700x180" name="Status hues" subtitle="Same lightness and chroma as clay, hue rotated" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="row" style="gap:20px">
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--moss);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--moss</span><span class="val">var(--moss)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--amber);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--amber</span><span class="val">var(--amber)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--rust);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--rust</span><span class="val">var(--rust)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--clay);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--clay</span><span class="val">var(--clay)</span></div>
  </div>
  </div>
</body></html>
