<!-- @dsCard group="Motion" viewport="700x190" name="Duration & easing" subtitle="Short, eased-out, never bouncy" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<style>
    @keyframes slide { 0%,10%{transform:translateX(0)} 60%,100%{transform:translateX(190px)} }
    .t{height:8px;width:8px;border-radius:50%;background:var(--clay)}
  </style>
  <div class="col" style="gap:14px">
    <div class="row" style="gap:16px"><span class="val" style="width:120px">fast · 140ms</span><div style="width:210px"><div class="t" style="animation:slide 2.4s cubic-bezier(0.2,0,0,1) infinite"></div></div></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">base · 220ms</span><div style="width:210px"><div class="t" style="animation:slide 2.4s cubic-bezier(0.16,1,0.3,1) infinite"></div></div></div>
<div class="row" style="gap:16px"><span class="val" style="width:120px">slow · 420ms</span><div style="width:210px"><div class="t" style="animation:slide 2.4s cubic-bezier(0.16,1,0.3,1) infinite"></div></div></div>
    <span class="val">--ease-standard cubic-bezier(.2,0,0,1) · --ease-out cubic-bezier(.16,1,.3,1)</span>
  </div>
</body></html>
