<!-- @dsCard group="Colors" viewport="700x200" name="Clay accent" subtitle="The only accent hue — used once or twice per screen" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="row" style="gap:20px">
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--clay);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--clay</span><span class="val">var(--clay)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--clay-strong);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--clay-strong</span><span class="val">var(--clay-strong)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--clay-line);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--clay-line</span><span class="val">var(--clay-line)</span></div>
  </div>
    <div class="col" style="gap:8px">
    <div style="width:104px;height:56px;border-radius:var(--radius-md);background:var(--clay-soft);border:1px solid var(--border-hairline)"></div>
    <div class="col" style="gap:3px"><span class="lbl">--clay-soft</span><span class="val">var(--clay-soft)</span></div>
  </div>
    <div class="col" style="gap:6px;margin-left:6px">
      <span style="font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--clay)">01</span>
      <span style="font:var(--type-h3);color:var(--ink-1)">Accent in use</span>
      <span style="font:var(--type-meta);color:var(--text-meta)">ordinals, one CTA, active underline</span>
    </div>
  </div>
</body></html>
