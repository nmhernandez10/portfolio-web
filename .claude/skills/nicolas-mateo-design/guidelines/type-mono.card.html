<!-- @dsCard group="Type" viewport="700x200" name="Mono — JetBrains Mono" subtitle="Labels, ordinals, metadata, code" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="col" style="gap:12px">
    <span style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-meta)">Selected work — 01</span>
    <div style="background:var(--paper-sunk);border-radius:var(--radius-md);padding:12px 16px;font:var(--type-code);color:var(--ink-2)">await queue.publish('session.completed', { id })</div>
    <span class="val">JetBrains Mono 400 / 500 · uppercase + 0.13em tracking for labels</span>
  </div>
</body></html>
