<!-- @dsCard group="Shape" viewport="700x180" name="Corner radii" subtitle="Small on containers, full pill on controls" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="row" style="gap:22px">
    <div class="col" style="gap:8px;align-items:center"><div style="width:78px;height:52px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper-raised)"></div><span class="val">sm · 4px</span></div>
<div class="col" style="gap:8px;align-items:center"><div style="width:78px;height:52px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper-raised)"></div><span class="val">md · 8px</span></div>
<div class="col" style="gap:8px;align-items:center"><div style="width:78px;height:52px;border:1px solid var(--line-2);border-radius:14px;background:var(--paper-raised)"></div><span class="val">lg · 14px</span></div>
<div class="col" style="gap:8px;align-items:center"><div style="width:78px;height:52px;border:1px solid var(--line-2);border-radius:20px;background:var(--paper-raised)"></div><span class="val">xl · 20px</span></div>
<div class="col" style="gap:8px;align-items:center"><div style="width:78px;height:52px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper-raised)"></div><span class="val">pill · 999px</span></div>
  </div>
</body></html>
