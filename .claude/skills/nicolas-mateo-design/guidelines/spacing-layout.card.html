<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="col" style="gap:12px">
    <div class="col" style="gap:5px"><span class="val">--width-wide · 1280px</span><div style="height:20px;width:100%;background:var(--paper-sunk);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div></div>
<div class="col" style="gap:5px"><span class="val">--width-content · 1080px</span><div style="height:20px;width:84%;background:var(--paper-sunk);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div></div>
<div class="col" style="gap:5px"><span class="val">--width-narrow · 680px</span><div style="height:20px;width:53%;background:var(--paper-sunk);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div></div>
  </div>
</body></html>
