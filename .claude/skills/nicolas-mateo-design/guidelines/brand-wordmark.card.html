<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="col" style="gap:14px">
    <span style="font:var(--weight-medium) 22px/1 var(--font-sans);letter-spacing:-0.01em;color:var(--ink-1)">Nicolás Hernández</span>
    <span style="font:var(--weight-light) 40px/1 var(--font-display);letter-spacing:var(--tracking-display);color:var(--ink-1)">Nicolás Hernández</span>
    <span class="val">sans for nav / mono-adjacent UI · serif for hero and print</span>
  </div>
</body></html>
