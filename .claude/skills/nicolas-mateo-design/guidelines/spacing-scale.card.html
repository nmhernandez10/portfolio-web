<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="4px base, eleven steps" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="col" style="gap:7px">
    <div class="row" style="gap:14px"><span class="val" style="width:86px">--space-1</span><div style="height:9px;width:4px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">4px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-2</span><div style="height:9px;width:8px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">8px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-3</span><div style="height:9px;width:12px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">12px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-4</span><div style="height:9px;width:16px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">16px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-5</span><div style="height:9px;width:24px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">24px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-6</span><div style="height:9px;width:32px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">32px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-7</span><div style="height:9px;width:48px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">48px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-8</span><div style="height:9px;width:64px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">64px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-9</span><div style="height:9px;width:96px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">96px</span></div>
<div class="row" style="gap:14px"><span class="val" style="width:86px">--space-10</span><div style="height:9px;width:128px;background:var(--clay-soft);border:1px solid var(--clay-line);border-radius:2px"></div><span class="val">128px</span></div>
  </div>
</body></html>
