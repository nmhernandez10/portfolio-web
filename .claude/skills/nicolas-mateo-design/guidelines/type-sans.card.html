<!-- @dsCard group="Type" viewport="700x210" name="Body — Instrument Sans" subtitle="Everything readable: UI, prose, headings" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--paper); }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .col { display:flex; flex-direction:column; gap: 10px; }
  .lbl { font: var(--type-label); letter-spacing:.06em; color: var(--text-meta); }
  .val { font: var(--type-label); color: var(--ink-4); }
</style></head><body>
<div class="col" style="gap:10px">
    <span style="font:var(--type-h1);letter-spacing:var(--tracking-heading);color:var(--ink-1)">Senior backend engineer</span>
    <p style="font:var(--type-body);color:var(--text-body);max-width:60ch">Service and API design, relational data modeling, and event-driven architecture — with correctness and observability built in rather than added later.</p>
    <span class="val">Instrument Sans 400 / 500 / 600</span>
  </div>
</body></html>
