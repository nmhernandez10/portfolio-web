<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:22px;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:20px}.stack{display:flex;flex-direction:column;gap:22px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body><div id="root"></div>
<script type="text/babel">
const { TextLink, SegmentedToggle, ThemeToggle } = window.NicolSMateoDesignSystem_080f14;
const B = "../../assets/icons";
function Demo(){
  const [lens,setLens] = React.useState("be");
  const [view,setView] = React.useState("work");
  return (
  <div className="stack">
    <div className="row">
      <TextLink href="#">nm.hernandez1996@gmail.com</TextLink>
      <TextLink href="#" external iconBase={B}>GitHub</TextLink>
      <TextLink href="#" tone="muted">Muted link</TextLink>
    </div>
    <div className="row">
      <SegmentedToggle value={lens} onChange={setLens} options={[{value:"be",label:"Backend"},{value:"fs",label:"Full stack"}]} />
      <SegmentedToggle size="sm" value={view} onChange={setView} options={[{value:"work",label:"Work"},{value:"stack",label:"Stack"},{value:"about",label:"About"}]} />
      <ThemeToggle iconBase={B} target={document.documentElement} />
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
