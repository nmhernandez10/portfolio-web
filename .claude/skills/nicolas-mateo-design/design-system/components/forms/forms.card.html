<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--surface-canvas)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;align-items:start}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Switch, Button } = window.NicolSMateoDesignSystem_080f14;
const B = "../../assets/icons";
function Demo(){
  const [on,setOn] = React.useState(true);
  return (
  <div className="grid">
    <Input label="Name" name="name" placeholder="Who is writing?" defaultValue="" />
    <Input label="Email" name="email" defaultValue="not-an-email" error="That address looks incomplete." />
    <Select label="What is this about?" iconBase={B} options={["A role","Contract work","Something else"]} />
    <div style={{display:"flex",flexDirection:"column",gap:16,paddingTop:2}}>
      <Switch checked={on} onChange={setOn} label="Reduce motion" description="Honours prefers-reduced-motion too." />
      <Switch checked={false} label="Email me updates" />
      <Switch checked={true} disabled label="Disabled, on" />
    </div>
    <Textarea label="What are you building?" rows={4} placeholder="A sentence or two is plenty." style={{gridColumn:"1 / -1"}} />
    <div style={{gridColumn:"1 / -1",display:"flex",gap:12}}>
      <Button icon="arrow-right" iconBase={B}>Send it</Button>
      <Button variant="ghost">Cancel</Button>
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
