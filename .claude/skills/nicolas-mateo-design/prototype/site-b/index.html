<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Nicolás Mateo — portrait portfolio</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-canvas)}#root{min-height:100vh}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../portfolio-site/data.js"></script>
<script>Object.assign(window, window.NicolSMateoDesignSystem_080f14 || {});</script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="PortraitScreens.jsx"></script>
<script type="text/babel">
function App(){
  const [lens,setLens] = React.useState("be");
  const [theme,setTheme] = React.useState("light");
  React.useEffect(()=>{document.documentElement.setAttribute("data-theme",theme)},[theme]);
  React.useEffect(()=>{
    const root = document.documentElement;
    const els = Array.from(document.querySelectorAll(".reveal"));
    const showAll = ()=>els.forEach(el=>el.classList.add("is-in"));
    if(typeof IntersectionObserver !== "function"){ showAll(); return; }
    root.classList.add("reveal-ready");
    let fired = false;
    const io = new IntersectionObserver((es)=>{fired=true;es.forEach(e=>{if(e.isIntersecting) e.target.classList.add("is-in")})},{rootMargin:"-40px"});
    els.forEach(el=>io.observe(el));
    const t = setTimeout(()=>{ if(!fired) showAll(); }, 900);
    return ()=>{clearTimeout(t);io.disconnect()};
  },[lens]);
  return (
    <React.Fragment>
      <PoHeader theme={theme} onTheme={setTheme} />
      <PoHero lens={lens} onLens={setLens} />
      <PoStats />
      <PoWork lens={lens} />
      <PoExperience />
      <PoStack lens={lens} />
      <PoAI />
      <PoContact />
      <PoFooter />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
