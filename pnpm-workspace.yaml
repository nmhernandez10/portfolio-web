# pnpm 11 blocks postinstall scripts by default; these need their native binary install to run.
allowBuilds:
  esbuild: true
  workerd: true # Cloudflare Workers runtime, used by wrangler dev and the adapter build
minimumReleaseAgeExclude:
  - "@astrojs/cloudflare@14.2.3"
  - "@astrojs/internal-helpers@0.10.4"
