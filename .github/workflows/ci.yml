name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  # Job id "ci" is referenced by branch protection as a required check — do not rename.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      # Structural guarantee, not a convenience: `wrangler pages dev` reads
      # .dev.vars and CI has none, so a placeholder makes "CI cannot send real
      # email" a property of the environment rather than of which code paths the
      # tests happen to take. Every endpoint case the suite exercises returns
      # before send() anyway. Written after the build (which does not need it)
      # and before the preview server (which does).
      - name: Placeholder secrets — CI must never send real email
        run: printf 'RESEND_API_KEY=ci-placeholder-not-a-key\n' > .dev.vars
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # pnpm's allowBuilds allowlist blocks Playwright's browser postinstall, so
      # the download is explicit here and in the README.
      - run: pnpm exec playwright install --with-deps chromium
      # pnpm build above already produced dist/; call playwright directly so the
      # test:e2e script's own build does not run a second time.
      - run: pnpm exec playwright test
