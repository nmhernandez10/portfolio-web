<!-- The brand has no logo: "the name set in type is the mark" (the wordmark
     card). At 32px only the initial fits, so the mark is an N in Newsreader's
     Light proportions - thin stems, a heavier diagonal, flat serifs - drawn as
     paths rather than <text>, because a favicon is a standalone image document
     with no access to the site's fonts.
     The colours are baked for the same reason: tokens/colors.css never reaches
     this file, so a var() reference to the ink token would be undefined here.
     #24201B is the light theme's ink-1 and #FBFAF7 its paper, converted from
     oklch to sRGB. The tile takes the radius-sm step (4), the ladder's small-chip
     value: a favicon is the smallest chip the system has, and the wider steps
     render as an app-icon squircle, which this brand does not do. Serifs are
     unbracketed, since brackets do not survive a 16px rendering. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#FBFAF7" />
  <path
    fill="#24201B"
    d="M7.6 7 H13.2 V7.9 H11.15 V24.1 H13.2 V25 H7.6 V24.1 H9.65 V7.9 H7.6 Z
       M18.8 7 H24.4 V7.9 H22.35 V24.1 H24.4 V25 H18.8 V24.1 H20.85 V7.9 H18.8 Z
       M9.65 7 H12.55 L22.35 25 H19.45 Z"
  />
</svg>
